# Render Blueprint. Each hackathon project in this repo is its own static site.
# Deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: parichay
    runtime: static
    rootDir: parichay
    buildCommand: npm test
    staticPublishPath: web
    buildFilter:
      paths: ["parichay/**"] # only redeploy when this project changes
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: just-one
    runtime: static
    rootDir: just-one
    buildCommand: npm test
    staticPublishPath: web
    buildFilter:
      paths: ["just-one/**"] # only redeploy when this project changes
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
